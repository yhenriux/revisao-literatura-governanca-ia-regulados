DF1EA" rx="8" stroke="#7F929C" stroke-width="0.8"/><text x="365" y="82" font-size="9" text-anchor="middle" fill="#124B61" font-weight="700">Interacional</text><text x="365" y="95" font-size="8.5" text-anchor="middle" fill="#24343D" font-weight="400"><tspan x="365" dy="0">limites, explicabilidade,</tspan><tspan x="365" dy="10">contestação e escalonamento</tspan></text><rect x="256" y="186" width="118" height="54" fill="#E5E7F5" rx="8" stroke="#7F929C" stroke-width="0.8"/><text x="315" y="206" font-size="9" text-anchor="middle" fill="#124B61" font-weight="700">Evolutiva</text><text x="315" y="219" font-size="8.5" text-anchor="middle" fill="#24343D" font-weight="400"><tspan x="315" dy="0">monitoramento, feedback,</tspan><tspan x="315" dy="10">aprendizagem e mudança</tspan></text><rect x="69" y="186" width="118" height="54" fill="#F7E7D0" rx="8" stroke="#7F929C" stroke-width="0.8"/><text x="128" y="206" font-size="9" text-anchor="middle" fill="#124B61" font-weight="700">Regulatória</text><text x="128" y="219" font-size="8.5" text-anchor="middle" fill="#24343D" font-weight="400"><tspan x="128" dy="0">risco, conformidade,</tspan><tspan x="128" dy="10">auditoria e documentação</tspan></text><rect x="19" y="62" width="118" height="54" fill="#E9E1F1" rx="8" stroke="#7F929C" stroke-width="0.8"/><text x="78" y="82" font-size="9" text-anchor="middle" fill="#124B61" font-weight="700">Organizacional</text><text x="78" y="95" font-size="8.5" text-anchor="middle" fill="#24343D" font-weight="400"><tspan x="78" dy="0">papéis, supervisão, incidentes</tspan><tspan x="78" dy="10">e accountability</tspan></text><text x="221.5" y="264" font-size="8.5" text-anchor="middle" fill="#5B6B73" font-weight="400">Camadas interdependentes: o diagrama não representa sequência nem escala de maturidade.</text></svg>